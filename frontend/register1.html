<!DOCTYPE html>
<html>
<head>
  <title>Register Olive Asset</title>
  <style>
    :root {
      --primary: #4a7c59; /* Olive green */
      --secondary: #d4a373; /* Earthy tan */
    }

    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f5ef;
    }

    nav {
      background-color: var(--primary);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    nav h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    nav .links a {
      color: white;
      margin-left: 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    nav .links a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 600px;
      margin: 3rem auto;
      padding: 2rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .asset-type {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1rem;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background-color: #3b6446;
    }
  </style>
</head>
<body>

  <nav>
    <h1>OliveChain</h1>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="farmer.html">Farmer</a>
      <a href="investor.html">Investor</a>
      <a href="register.html">Register Asset</a>
    </div>
  </nav>

  <div class="container">
    <form id="assetForm">
      <h2>Register New Asset</h2>
      
      <div class="asset-type">
        <label>
          <input type="radio" name="assetType" value="tree" checked> Tree
        </label>
        <label>
          <input type="radio" name="assetType" value="seed"> Seed
        </label>
      </div>

      <div class="form-group">
        <label>Cultivar</label>
        <input type="text" id="cultivar" placeholder="Chemlali" required>
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text" id="location" placeholder="Sfax, Tunisia" required>
      </div>

      <div class="form-group">
        <label>DNA Hash</label>
        <input type="text" id="dna" placeholder="sha256:a1b2c3..." required>
      </div>

      <button type="submit">Register</button>
    </form>
  </div>

  <script>
    document.getElementById("assetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const assetType = document.querySelector('input[name="assetType"]:checked').value;
      const payload = {
        type: assetType,
        cultivar: document.getElementById("cultivar").value,
        location: document.getElementById("location").value,
        dna: document.getElementById("dna").value
      };

      try {
        const response = await registerAsset(payload); // Make sure registerAsset is defined
        console.log("Asset registered:", response);
        alert("Asset registered successfully!");
      } catch (err) {
        console.error("Registration failed:", err);
        alert("Error registering asset.");
      }
    });
  </script>

</body>
</html>
